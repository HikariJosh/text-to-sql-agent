logging:
   file:
      enable: true
      level: INFO
      path: logs
      rotation: "10 MB"
      retention: "7 days"
   console:
      enable: true
      level: INFO

db_meta:
   host: ${oc.env:DB_META_HOST,localhost}
   port: 3306
   user: hikari
   password: ${oc.env:META_DB_PASSWORD}
   database: meta

db_dw:
   host: ${oc.env:DB_DW_HOST,localhost}
   port: 3306
   user: hikari
   password: ${oc.env:DW_DB_PASSWORD}
   database: mavenfuzzyfactory

qdrant:
   host: ${oc.env:QDRANT_HOST,localhost}
   port: 6333
   embedding_size: 1024

embedding:
   host: ${oc.env:EMBEDDING_HOST,localhost}
   port: ${oc.env:EMBEDDING_PORT,8081}
   model: BAAI/bge-large-zh-v1.5

es:
   host: ${oc.env:ES_HOST,localhost}
   port: 9200
   index_name: data_agent

llm:
   model_name: LongCat-Flash-Chat
   api_key: ${oc.env:LLM_API_KEY}
   base_url: https://api.longcat.chat/openai/v1
