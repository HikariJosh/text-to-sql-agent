[project]
name = "data-agent"
version = "0.1.0"
description = "Text-to-SQL Agent: 自然语言查询数据仓库"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncmy>=0.2.11",
    "cryptography>=45.0.0",
    "elasticsearch[async]>=8.19.0,<9.0.0",
    "fastapi>=0.136.0",
    "greenlet>=3.4.0",
    "httpx>=0.28",
    "jieba>=0.42.1",
    "langchain>=1.2.15",
    "langchain-openai>=0.3.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.1.0",
    "qdrant-client>=1.17.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.34.0",
]

[project.scripts]
build-meta-knowledge = "app.scripts.build_meta_knowledge:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
