services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hikari123}
      MYSQL_USER: ${MYSQL_USER:-hikari}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hikari123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init_meta.sql:/docker-entrypoint-initdb.d/01_init_meta.sql
      - ./mysql/init_dw.sql:/docker-entrypoint-initdb.d/02_init_dw.sql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci

  elasticsearch:
    build: ./elasticsearch
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.19.10
    container_name: kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-sha-5bc4d88
    container_name: embedding
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./embedding/bge-large-zh-v1.5:/models/bge-large-zh-v1.5
    command: --model-id /models/bge-large-zh-v1.5

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: data-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DB_META_HOST=mysql
      - DB_DW_HOST=mysql
      - QDRANT_HOST=qdrant
      - ES_HOST=elasticsearch
      - EMBEDDING_HOST=embedding
      - EMBEDDING_PORT=80
    depends_on:
      - mysql
      - qdrant
      - elasticsearch
      - embedding

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  mysql_data:
  es_data:
  qdrant_data:
